l_english:
 greek_focus:0 "Greek DLC national focus"
 greece_rework.1.t:0 "Military Offers a Self-Coup"
greece_rework.1.d:0 "It's no secret the Greek military has a... very cautious attitude towards democracy, to say the least. Seeing it as an easy way to empower communists, anarchists, and traitors who would seek to weaken or destroy greece, many seniors in the military wish to see the scheduled Greek elections be canceled. Thus, several generals are offering King George to take to the streets of Athens, suspend parliament, and declare a government unchained from democratic principals.\n\nKing George indeed isn't exactly a strong constitutionalist liberal, but he has seen building a healthy democracy as a possible way to stabilize Greece and strengthen the support of the monarchy amongst Greece's people. Thus, the king remains conflicted. While the liberals winning the elections would be unlikely, if they do, they may threaten his power. However, can he really turn his back on his promises just mere months after making them? There's also the question on if a military junta ruling the country would really bring social stability to Greece."
greece_rework.1.a:0 "We will have no such thing!"
greece_rework.1.b:0 "...Let's go through with it"
GRE_nation_under_watch: "Heavily Politicized Military"
GRE_politicized_army: "A Nation Under Watch"
greece_rework.2.t:0 "1936 Elections"
GRE_government_in_crisis: "Government in Crisis"
greece_rework.2.d:0 "Underwent with an unusual level of calm and sincerity, the 1936 elections in Greece have concluded, and the results have no party with a majority in parliament. While the liberals and Venizelists have captured the most of seats in parliament, they still do not have enough to run a government on their own. The populists and conservatives have won the vast majority of the remaining seats, while Metaxas's radical - and mostly irrelevent ultra nationalist party, as well as the communist party have made up the rest. With no party having a majority, the government is in deep crisis. The liberals are expected to govern in a lame duck era, with bickering being about the only highlight achievement achieved for the next year at least."
greece_rework.2.a: "Well, that's how the cookie crumbles"
GRE_politicized_army_desc: "The Greek military has an extreme, and unhealthy level of influence over the political affairs of Greece. The army historically has proven it has no issues with intervening in Greece's politics to enforce its will. Being made up of right wing radical anti communist and pro monarchist forces, the military is likely to intervene against any governments seen as too left wing or governments compromising the security of the monarchy.\n\nIf the anger of the army reaches §R5§! or higher, they will perform a §Rcoup§!. The current level of military anger is §Y[?GRE_military_anger]§!"
GRE_mil_anger_1: "Modify level of Military Anger by: §R+1§!"
GRE_mil_anger_2: "Modify level of Military Anger by: §R+2§!"
minister_of_army_affairs: "Minister of Army Affairs"
greece_rework.3.t: "The Suprise of this Election"
greece_rework.3.d: "If you asked Greek political experts to point out the most suprising part of the recent 1936 elections, they will most likely tell you that they ended up going through without a military coup. If you ask them the second most suprising part of the 1936 elections, they'd probably tell you the strong performance of the communist party. Winning a respectable 15 seats, the communist party critically now has enough seats to break any deadlock in parliament likely to occur due to the liberals falling just short of a majority. Not only is 15 seats much higher then expected for them, this new position of being able to push through liberal agenda if they please gives them immense influence over the new political situation of Greece, and they're expected to demand several concessions from the liberals in return for granting them support.\n\nThe military, of course, is very displeased with this new political reality. Officers already wanted to perform a coup before the january elections, and the results of this election has been what they feared all along: the communists, although to a small degree, having immense political influence over the Greek government. Officers have held back for now, but they have indeed made it clear if the communist party is included in any ruling government coalitions, they absolutely will not hesistate to launch a coup."
greece_rework.3.a: "We should try to cool their anger, at least a little"
greece_rework.3.b: "We must remain on guard against the communists!"
greece_rework.4.t: "Fractured Populist Movement"
greece_rework.4.d: "One of the 3 major Greek political parties has always been the populist party. Largely rural, socially conservative and economically liberal, the party has historically had several wings ranging from left and right. As of recent, the party has increasingly become dysfunctional. With such a wide range on every issue you can imagine, the party is struggling to stay united behind basically anything. With several populists both supporting and opposing working with the liberals to form a majority government, the party is really starting to show its tears. "
greece_rework.4.a: "Certainly not going to help our politcal stability"